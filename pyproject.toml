[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analysisdaily"
version = "0.1.0"
description = "中立客观日报系统：多源摄取→事件聚类→事实核验与偏见分析→结构化日报"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "analysisdaily" }]
dependencies = [
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "scikit-learn>=1.3",
  "feedparser>=6.0",
  "requests>=2.31",
  "jinja2>=3.1",
  "apscheduler>=3.10",
]

[project.optional-dependencies]
# 正文高质量提取（可选）
extract = ["trafilatura>=1.8"]
# 语义嵌入（可选，离线下载模型；无则回退 TF-IDF 确定性向量）
embed = ["sentence-transformers>=2.5"]
# llm 事实引擎（可选）
llm = ["httpx>=0.27"]
# PostgreSQL/pgvector 存储（本地 docker 容器）
db = ["psycopg[binary]>=3.1"]
# 开发/测试
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
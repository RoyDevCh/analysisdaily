name: Daily Neutral News Report

on:
  schedule:
    # 每天 UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - ".github/workflows/daily.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[extract]

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
          LLM_BASE_URL=${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          LLM_MODEL=${{ secrets.LLM_MODEL }}
          GROUND_NEWS_API_KEY=${{ secrets.GROUND_NEWS_API_KEY }}
          ALLSIDES_API_KEY=${{ secrets.ALLSIDES_API_KEY }}
          EMBEDDING_BACKEND=${{ secrets.EMBEDDING_BACKEND }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          SMTP_TO=${{ secrets.SMTP_TO }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN=${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}
          EOF
          echo "env written"

      - name: Generate daily report
        run: python -m analysisdaily --run --out data/daily-reports

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: data/daily-reports/

      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily-reports data/threads.json || true
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "daily report [skip ci]"; git push; fi
